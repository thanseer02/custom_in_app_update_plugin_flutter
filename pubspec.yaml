name: custom_app_update
description: Android in-app updates with custom Flutter UI, real download progress, and restart control using the official Google Play library.
version: 0.2.0-dev.1
topics:
  - android
  - in-app-update
  - google-play

platforms:
  android:

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.customappupdate
        pluginClass: CustomAppUpdatePlugin
